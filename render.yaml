# Multi-stage build for lightweight Rust executable
FROM rust:1.80 as builder
WORKDIR /app
COPY . .
RUN cargo build --release

FROM debian:bookworm-slim
WORKDIR /app
COPY --from=builder /app/target/release/cuttersdashboard /usr/local/bin/cuttersdashboard

# Create directory for SQLite persistent disk
RUN mkdir -p /data

ENV PORT=8000
ENV HOST=0.0.0.0
ENV DB_PATH=/data/orders.sqlite3

EXPOSE 8000
CMD ["cuttersdashboard"]