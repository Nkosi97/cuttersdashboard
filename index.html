<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Collection Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Pickup board</p>
          <h1>Customer Collection</h1>
        </div>
        <div class="live-badge">Live display</div>
      </header>

      <main aria-label="Customer order status">
        <p id="syncStatus" class="sync-status" role="status" aria-live="polite">Connecting to cashier...</p>
        <div class="board-grid">
          <section class="panel panel-preparing" aria-labelledby="preparing-title">
            <div class="panel-header">
              <h2 id="preparing-title">Preparing</h2>
              <span id="preparingCount" class="count-badge">0</span>
            </div>
            <div id="preparingList" class="order-list"></div>
          </section>

          <section class="panel panel-ready" aria-labelledby="ready-title">
            <div class="panel-header">
              <h2 id="ready-title">Ready</h2>
              <span id="readyCount" class="count-badge">0</span>
            </div>
            <div id="readyList" class="order-list"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
